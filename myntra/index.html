<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Assistant, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; box-shadow: 0 4px 12px 0 rgba(0,0,0,.05); position: fixed; top:0; left:0; right:0; background: #fff; z-index: 100; }
        .logo { font-weight: 900; color: #ff3f6c; font-size: 24px; text-decoration: none; }
        .nav-menu { display: flex; gap: 30px; list-style: none; font-size: 14px; font-weight: 700; text-transform: uppercase; }
        .search-bar { width: 400px; display: flex; align-items: center; background: #f5f5f6; padding: 10px; border-radius: 4px; }
        .search-bar input { background: transparent; border: none; outline: none; width: 100%; font-size: 14px; }
        .user-actions { display: flex; gap: 25px; align-items: center; }
        .bag-icon { position: relative; cursor: pointer; text-decoration: none; color: #333; font-weight: bold; }
        .bag-count { position: absolute; top: -12px; right: -15px; background: #ff3f6c; color: #fff; font-size: 12px; padding: 2px 6px; border-radius: 50%; }
        
        main { display: flex; margin-top: 80px; padding: 30px 50px; }
        .sidebar { width: 20%; padding-right: 20px; border-right: 1px solid #edebef; }
        .sidebar h3 { font-size: 16px; margin-bottom: 15px; text-transform: uppercase; }
        .filter-group { margin-bottom: 25px; }
        .filter-group label { display: block; margin: 8px 0; font-size: 14px; color: #282c3f; cursor: pointer; }
        
        .content-area { width: 80%; padding-left: 30px; }
        .sort-options { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .sort-options select { padding: 8px; border: 1px solid #eaeaec; border-radius: 2px; outline: none; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; }
        .product-card { border: 1px solid transparent; transition: all 0.2s ease; cursor: pointer; position: relative; }
        .product-card:hover { box-shadow: 0 7px 15px rgba(0,0,0,.1); border: 1px solid #eaeaec; }
        .product-img { width: 100%; height: 280px; background-color: #f5f5f6; object-fit: cover; }
        .product-info { padding: 10px; }
        .brand { font-size: 16px; font-weight: 700; color: #282c3f; margin-bottom: 4px; }
        .name { font-size: 14px; color: #535766; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .price-box { font-size: 14px; font-weight: 700; }
        .original-price { text-decoration: line-through; color: #7e818c; font-weight: 400; margin-left: 5px; font-size: 12px; }
        .discount { color: #ff905a; font-size: 12px; margin-left: 5px; }
        .add-to-bag-btn { width: 100%; background: #ff3f6c; color: white; border: none; padding: 10px; font-weight: 700; cursor: pointer; border-radius: 2px; margin-top: 5px; opacity: 0; transition: opacity 0.2s; }
        .product-card:hover .add-to-bag-btn { opacity: 1; }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">Myntra</a>
        <ul class="nav-menu">
            <li>Men</li><li>Women</li><li>Kids</li>
        </ul>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search for products, brands and more">
        </div>
        <div class="user-actions">
            <a href="bag.html" class="bag-icon">Bag <span class="bag-count" id="bagCount">0</span></a>
        </div>
    </header>

    <main>
        <aside class="sidebar">
            <h3>Filters</h3>
            <div class="filter-group">
                <h4>Categories</h4>
                <label><input type="checkbox" class="category-filter" value="Tshirt"> Tshirts</label>
                <label><input type="checkbox" class="category-filter" value="Shoes"> Shoes</label>
                <label><input type="checkbox" class="category-filter" value="Jeans"> Jeans</label>
            </div>
            <div class="filter-group">
                <h4>Brands</h4>
                <label><input type="checkbox" class="brand-filter" value="Roadster"> Roadster</label>
                <label><input type="checkbox" class="brand-filter" value="HRX"> HRX</label>
                <label><input type="checkbox" class="brand-filter" value="Nike"> Nike</label>
            </div>
        </aside>

        <section class="content-area">
            <div class="sort-options">
                <select id="sortSelect">
                    <option value="default">Sort by: Recommended</option>
                    <option value="low-high">Price: Low to High</option>
                    <option value="high-low">Price: High to Low</option>
                </select>
            </div>
            <div class="product-grid" id="productGrid"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
