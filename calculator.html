<!DOCTYPE html>
<html lang="en">
<head>
    
 <link rel="stylesheet" href="calculator.css">  
    <title>Document</title>
    
</head>
<body>
    <div id="calculator">
    
        <input id="text-id" type="text" readonly>
    <button class="button" onclick="document.querySelector('#text-id').value=''">clear</button>
        <button class="button" onclick="document.querySelector('#text-id').value+='+'">+</button>
        <button class="button" onclick="document.querySelector('#text-id').value+='-'">-</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='*'">*</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='/'">/</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='1'">1</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='2'">2</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='3'">3</button>
    <button class="button"  onclick="document.querySelector('#text-id').value+='4'">4</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='5'">5</button>
    <button class="button"  onclick="document.querySelector('#text-id').value+='6'">6</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='7'">7</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='8'">8</button>
    <button class="button" onclick="document.querySelector('#text-id').value+='9'">9</button>
      <button class="button" onclick="document.querySelector('#text-id').value+='0'">0</button>
      <button class="button" onclick="let value=document.querySelector('#text-id').value
       result=eval(value);
       document.querySelector('#text-id').value=result
      ">=</button>

    <script>
  
    </script>

    </div>
</body>
</html>
